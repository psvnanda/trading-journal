<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trading Journal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { 
            background: linear-gradient(to bottom right, #0f172a, #1e293b, #0f172a);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        .auth-screen { text-align: center; padding: 2rem 1rem; }
        .auth-form { background: rgba(30, 41, 59, 0.5); border: 1px solid rgb(71, 85, 105); padding: 2rem; border-radius: 0.5rem; max-width: 400px; margin: 2rem auto; }
        .auth-input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: rgb(55, 65, 81); border: 1px solid rgb(71, 85, 105); color: white; border-radius: 0.375rem; font-size: 1rem; }
        .auth-input::placeholder { color: #94a3b8; }
        .auth-btn { width: 100%; padding: 0.75rem 1rem; background: #2563eb; color: white; border: none; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; font-weight: 600; margin-bottom: 0.5rem; }
        .auth-btn:hover:not(:disabled) { background: #1d4ed8; }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-toggle { color: #60a5fa; cursor: pointer; text-decoration: underline; font-size: 0.875rem; }
        .user-bar { position: absolute; top: 1rem; right: 1rem; color: #94a3b8; font-size: 0.875rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .sign-out { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
        h1 { font-size: 2rem; font-weight: 700; color: white; margin-bottom: 0.5rem; margin-top: 2rem; }
        p { color: #94a3b8; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(55, 65, 81, 0.5); border: 1px solid rgb(71, 85, 105); padding: 1rem; border-radius: 0.5rem; }
        .stat-label { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: white; }
        .stat-subtext { font-size: 0.75rem; color: #64748b; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; border: none; cursor: pointer; background: rgb(55, 65, 81); color: #cbd5e1; transition: all 0.2s; }
        .tab-btn.active { background: #2563eb; color: white; }
        .tab-btn.export { margin-left: auto; }
        .content { display: none; }
        .content.active { display: block; }
        .form-container { background: rgba(30, 41, 59, 0.5); border: 1px solid rgb(71, 85, 105); padding: 1.5rem; border-radius: 0.5rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.875rem; font-weight: 500; color: #cbd5e1; margin-bottom: 0.5rem; }
        input, select, textarea { background: rgb(55, 65, 81); border: 1px solid rgb(71, 85, 105); padding: 0.5rem 0.75rem; color: white; border-radius: 0.375rem; font-size: 1rem; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        textarea { resize: vertical; min-height: 5rem; width: 100%; grid-column: 1 / -1; margin-bottom: 1rem; }
        button { padding: 0.75rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .submit-btn { width: 100%; background: #2563eb; color: white; font-size: 1rem; }
        .submit-btn:hover { background: #1d4ed8; }
        .journal-container { background: rgba(30, 41, 59, 0.5); border: 1px solid rgb(71, 85, 105); border-radius: 0.5rem; overflow: hidden; }
        .empty { padding: 2rem; text-align: center; color: #94a3b8; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; font-size: 0.875rem; border-collapse: collapse; }
        thead { background: rgba(55, 65, 81, 0.5); border-bottom: 1px solid rgb(71, 85, 105); }
        th { padding: 0.75rem; text-align: left; color: #cbd5e1; font-weight: 600; }
        td { padding: 0.75rem; border-bottom: 1px solid rgb(71, 85, 105); }
        tbody tr:hover { background: rgba(55, 65, 81, 0.3); }
        .badge { background: rgba(55, 65, 81, 0.5); padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; display: inline-block; }
        .badge-call { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-put { background: rgba(248, 113, 113, 0.2); color: #f87171; }
        .green { color: #4ade80; font-weight: 700; }
        .red { color: #f87171; font-weight: 700; }
        .delete-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 1.125rem; }
        .delete-btn:hover { color: #fb7185; }
        .hidden { display: none; }
        .error { color: #f87171; font-size: 0.875rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-screen">
        <h1>Trading Journal</h1>
        <p style="margin-bottom: 2rem;">Track stocks & options. Cloud-synced.</p>
        
        <div class="auth-form">
            <h2 id="authTitle" style="margin-bottom: 1.5rem; font-size: 1.25rem;">Sign Up</h2>
            <input type="email" id="authEmail" class="auth-input" placeholder="Email" autocomplete="email">
            <input type="password" id="authPassword" class="auth-input" placeholder="Password (min 6 chars)" autocomplete="current-password">
            <button id="authSubmit" class="auth-btn" onclick="handleAuth()" disabled>Create Account</button>
            <div id="authError" class="error" style="text-align: left;"></div>
            <div style="text-align: center; margin-top: 1rem;">
                <p style="color: #94a3b8; margin-bottom: 0.5rem;" id="toggleText">Already have an account?</p>
                <span class="auth-toggle" onclick="toggleAuthMode()">Sign In</span>
            </div>
        </div>
        <p style="margin-top: 2rem; font-size: 0.875rem; color: #64748b;">Initializing...</p>
    </div>

    <div id="appScreen" style="display:none;">
        <div class="user-bar" id="userBar"></div>
        <div class="container">
            <h1>Trading Journal</h1>
            <p>Track every trade. Master your edge.</p>

            <div id="stats" class="stats-grid" style="display:none;"></div>

            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('entry')">+ New Trade</button>
                <button class="tab-btn" onclick="showTab('journal')">Journal (<span id="trade-count">0</span>)</button>
                <button class="tab-btn export" onclick="exportCSV()">📥 Export CSV</button>
            </div>

            <div id="entry" class="content active">
                <div class="form-container">
                    <form onsubmit="addTrade(event)">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" id="date" required>
                            </div>
                            <div class="form-group">
                                <label>Asset Type</label>
                                <select id="assetType" onchange="updateFormFields()">
                                    <option value="stock">Stock</option>
                                    <option value="call">Call Option</option>
                                    <option value="put">Put Option</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Symbol</label>
                                <input type="text" id="symbol" placeholder="SPY, QQQ" required>
                            </div>
                            <div class="form-group hidden" id="strikeGroup">
                                <label>Strike Price</label>
                                <input type="number" id="strikePrice" step="0.01">
                            </div>
                            <div class="form-group hidden" id="expiryGroup">
                                <label>Expiration Date</label>
                                <input type="date" id="expiryDate">
                            </div>
                            <div class="form-group">
                                <label>Setup Type</label>
                                <select id="setupType">
                                    <option value="scalp">Scalp (0DTE)</option>
                                    <option value="swing">Swing</option>
                                    <option value="gap">Gap Trade</option>
                                    <option value="breakout">Breakout</option>
                                    <option value="pullback">Pullback</option>
                                    <option value="vwap">VWAP</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Entry Time</label>
                                <input type="time" id="entryTime" value="09:30">
                            </div>
                            <div class="form-group">
                                <label>Entry Price</label>
                                <input type="number" id="entryPrice" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Exit Time</label>
                                <input type="time" id="exitTime" value="16:00">
                            </div>
                            <div class="form-group">
                                <label>Exit Price</label>
                                <input type="number" id="exitPrice" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label id="qtyLabel">Quantity (Shares)</label>
                                <input type="number" id="quantity" step="1" required>
                            </div>
                            <div class="form-group">
                                <label>Platform</label>
                                <select id="platform">
                                    <option value="robinhood">Robinhood</option>
                                    <option value="webull">Webull</option>
                                    <option value="thinkorswim">ThinkOrSwim</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea id="notes" placeholder="What did you notice?"></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Save Trade</button>
                    </form>
                </div>
            </div>

            <div id="journal" class="content">
                <div class="journal-container">
                    <div id="journal-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://etfyqcyansquhhmytrxy.supabase.co'
        const SUPABASE_KEY = 'sb_publishable_IG9Ii3uH1Zu-kQwVGNwYlw_RkbYSZz_'

        let currentUser = null
        let trades = []
        let isSignUpMode = true

        async function initAuth() {
            // Check for existing session
            const token = localStorage.getItem('sb_token')
            const userId = localStorage.getItem('sb_user_id')
            const userEmail = localStorage.getItem('sb_user_email')

            if (token && userId) {
                currentUser = { id: userId, email: userEmail }
                showAppScreen()
            } else {
                document.getElementById('authSubmit').disabled = false
            }
        }

        function showAuthScreen() {
            document.getElementById('authScreen').style.display = 'block'
            document.getElementById('appScreen').style.display = 'none'
        }

        function showAppScreen() {
            document.getElementById('authScreen').style.display = 'none'
            document.getElementById('appScreen').style.display = 'block'
            document.getElementById('userBar').innerHTML = `
                <span>${currentUser.email}</span>
                <button class="sign-out" onclick="signOut()">Sign out</button>
            `
            setToday()
            loadTrades()
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode
            document.getElementById('authTitle').textContent = isSignUpMode ? 'Sign Up' : 'Sign In'
            document.getElementById('authSubmit').textContent = isSignUpMode ? 'Create Account' : 'Sign In'
            document.getElementById('toggleText').textContent = isSignUpMode ? 'Already have an account?' : 'Need an account?'
            document.querySelector('.auth-toggle').textContent = isSignUpMode ? 'Sign In' : 'Sign Up'
            document.getElementById('authError').textContent = ''
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value
            const password = document.getElementById('authPassword').value
            const errorEl = document.getElementById('authError')
            const btn = document.getElementById('authSubmit')

            if (!email || !password) {
                errorEl.textContent = 'Email and password required'
                return
            }

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters'
                return
            }

            btn.disabled = true
            errorEl.textContent = 'Processing...'

            try {
                const endpoint = isSignUpMode ? 'signup' : 'signin'
                const response = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                })

                const data = await response.json()

                if (response.ok && data.session) {
                    currentUser = data.user
                    localStorage.setItem('sb_token', data.session.access_token)
                    localStorage.setItem('sb_user_id', data.user.id)
                    localStorage.setItem('sb_user_email', data.user.email)
                    
                    errorEl.textContent = ''
                    document.getElementById('authEmail').value = ''
                    document.getElementById('authPassword').value = ''
                    
                    showAppScreen()
                } else {
                    errorEl.textContent = data.error_description || data.message || 'Authentication failed'
                    btn.disabled = false
                }
            } catch (err) {
                errorEl.textContent = 'Network error: ' + err.message
                btn.disabled = false
            }
        }

        function signOut() {
            localStorage.removeItem('sb_token')
            localStorage.removeItem('sb_user_id')
            localStorage.removeItem('sb_user_email')
            currentUser = null
            trades = []
            document.getElementById('authEmail').value = ''
            document.getElementById('authPassword').value = ''
            document.getElementById('authError').textContent = ''
            showAuthScreen()
        }

        function updateFormFields() {
            const assetType = document.getElementById('assetType').value
            document.getElementById('strikeGroup').classList.toggle('hidden', assetType === 'stock')
            document.getElementById('expiryGroup').classList.toggle('hidden', assetType === 'stock')
            document.getElementById('qtyLabel').textContent = assetType === 'stock' ? 'Quantity (Shares)' : 'Quantity (Contracts)'
        }

        async function loadTrades() {
            if (!currentUser) return
            
            const token = localStorage.getItem('sb_token')
            if (!token) return

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/trades?user_id=eq.${currentUser.id}&order=date.desc`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${token}`
                        }
                    }
                )

                if (response.status === 401) {
                    signOut()
                    return
                }

                const data = await response.json()
                trades = Array.isArray(data) ? data : []
                document.getElementById('trade-count').textContent = trades.length
                renderJournal()
            } catch (err) {
                console.error('Error loading trades:', err)
            }
        }

        async function addTrade(e) {
            e.preventDefault()
            if (!currentUser) return

            const token = localStorage.getItem('sb_token')
            if (!token) return

            const entry = parseFloat(document.getElementById('entryPrice').value)
            const exit = parseFloat(document.getElementById('exitPrice').value)
            const qty = parseFloat(document.getElementById('quantity').value)
            const assetType = document.getElementById('assetType').value
            const multiplier = (assetType !== 'stock') ? 100 : 1
            const pnl = (exit - entry) * qty * multiplier
            const pnlPercent = ((exit - entry) / entry * 100).toFixed(2)

            const trade = {
                user_id: currentUser.id,
                date: document.getElementById('date').value,
                asset_type: assetType,
                symbol: document.getElementById('symbol').value,
                strike_price: assetType !== 'stock' ? parseFloat(document.getElementById('strikePrice').value) : null,
                expiry_date: assetType !== 'stock' ? document.getElementById('expiryDate').value : null,
                entry_time: document.getElementById('entryTime').value,
                entry_price: entry,
                exit_time: document.getElementById('exitTime').value,
                exit_price: exit,
                quantity: qty,
                setup_type: document.getElementById('setupType').value,
                notes: document.getElementById('notes').value,
                platform: document.getElementById('platform').value,
                pnl: parseFloat(pnl.toFixed(2)),
                pnl_percent: parseFloat(pnlPercent),
                won: pnl > 0
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/trades`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(trade)
                })

                if (response.ok) {
                    e.target.reset()
                    setToday()
                    await loadTrades()
                    showTab('journal')
                } else {
                    alert('Error: ' + response.statusText)
                }
            } catch (err) {
                alert('Error: ' + err.message)
            }
        }

        async function deleteTrade(id) {
            if (!confirm('Delete this trade?')) return

            const token = localStorage.getItem('sb_token')
            if (!token) return

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/trades?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token}`
                    }
                })

                if (response.ok) {
                    await loadTrades()
                }
            } catch (err) {
                alert('Error: ' + err.message)
            }
        }

        function getAssetDisplay(trade) {
            if (trade.asset_type === 'stock') {
                return `<span class="badge">${trade.symbol}</span>`
            } else {
                const type = trade.asset_type === 'call' ? 'C' : 'P'
                const badgeClass = trade.asset_type === 'call' ? 'badge-call' : 'badge-put'
                return `<span class="badge ${badgeClass}">${trade.symbol} ${trade.strike_price} ${type}</span>`
            }
        }

        function renderJournal() {
            const container = document.getElementById('journal-content')
            if (trades.length === 0) {
                container.innerHTML = '<div class="empty"><p>No trades yet. Start logging!</p></div>'
                document.getElementById('stats').style.display = 'none'
                return
            }

            const wins = trades.filter(t => t.won).length
            const winRate = ((wins / trades.length) * 100).toFixed(1)
            const totalPnL = trades.reduce((sum, t) => sum + t.pnl, 0).toFixed(2)
            const avgPnL = (totalPnL / trades.length).toFixed(2)
            const bestTrade = Math.max(...trades.map(t => t.pnl)).toFixed(2)
            const worstTrade = Math.min(...trades.map(t => t.pnl)).toFixed(2)

            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value">${winRate}%</div><div class="stat-subtext">${wins}W / ${trades.length - wins}L</div></div>
                <div class="stat-card"><div class="stat-label">Total P&L</div><div class="stat-value ${totalPnL >= 0 ? 'green' : 'red'}">$${totalPnL}</div></div>
                <div class="stat-card"><div class="stat-label">Avg Trade</div><div class="stat-value ${avgPnL >= 0 ? 'green' : 'red'}">$${avgPnL}</div></div>
                <div class="stat-card"><div class="stat-label">Best / Worst</div><div class="stat-subtext green">$${bestTrade}</div><div class="stat-subtext red">$${worstTrade}</div></div>
            `
            document.getElementById('stats').style.display = 'grid'

            let html = '<div class="table-wrapper"><table><thead><tr><th>Date</th><th>Asset</th><th>Entry</th><th>Exit</th><th>Qty</th><th>Setup</th><th style="text-align:right;">P&L</th><th>Notes</th><th style="text-align:center;">Delete</th></tr></thead><tbody>'
            trades.forEach(t => {
                const qty = t.asset_type === 'stock' ? `${t.quantity} sh` : `${t.quantity} ct`
                html += `<tr>
                    <td>${t.date}</td>
                    <td>${getAssetDisplay(t)}</td>
                    <td>$${t.entry_price.toFixed(2)} @ ${t.entry_time}</td>
                    <td>$${t.exit_price.toFixed(2)} @ ${t.exit_time}</td>
                    <td>${qty}</td>
                    <td><span class="badge">${t.setup_type}</span></td>
                    <td style="text-align:right;" class="${t.pnl >= 0 ? 'green' : 'red'}">$${t.pnl.toFixed(2)} (${t.pnl_percent}%)</td>
                    <td style="font-size:0.75rem;color:#94a3b8;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.notes}</td>
                    <td style="text-align:center;"><button class="delete-btn" onclick="deleteTrade('${t.id}')">🗑️</button></td>
                </tr>`
            })
            html += '</tbody></table></div>'
            container.innerHTML = html
        }

        function exportCSV() {
            if (trades.length === 0) {
                alert('No trades to export')
                return
            }
            const headers = ['Date', 'Asset Type', 'Symbol', 'Strike', 'Expiry', 'Entry Time', 'Entry Price', 'Exit Time', 'Exit Price', 'Quantity', 'P&L', 'P&L %', 'Setup', 'Platform', 'Notes']
            const rows = trades.map(t => [t.date, t.asset_type, t.symbol, t.strike_price || '', t.expiry_date || '', t.entry_time, t.entry_price, t.exit_time, t.exit_price, t.quantity, t.pnl, t.pnl_percent, t.setup_type, t.platform, t.notes])
            const csv = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n')
            const blob = new Blob([csv], { type: 'text/csv' })
            const url = window.URL.createObjectURL(blob)
            const a = document.createElement('a')
            a.href = url
            a.download = `trading-journal-${new Date().toISOString().split('T')[0]}.csv`
            a.click()
        }

        function showTab(tab) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'))
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'))
            document.getElementById(tab).classList.add('active')
            document.querySelector(`[onclick="showTab('${tab}')"]`).classList.add('active')
            if (tab === 'journal') renderJournal()
        }

        function setToday() {
            document.getElementById('date').valueAsDate = new Date()
        }

        // Initialize on page load
        window.addEventListener('load', initAuth)
    </script>
</body>
</html>
